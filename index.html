<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Spilcafé</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
<img src="img/logo.png" alt="Logo" class="logo">
<img src="img/menu.png" alt="" class="lines">
<div class="back-btn" onclick="history.back()">
  ← Tilbage
</div>

  </header>

<section>
  <h1>Spiloversigt</h1>
<p>Udforsk vores samling af spil</p>
</section>

<select id="filter">
  <option value="filtrer">Filtrer</option>
  <option value="genre">Genre</option>
  <option value="spillere">Antal spillere</option>
  <option value="spilletid">Spilletid</option>
  <option value="sværhedsgrad">Sværhedsgrad</option>
  <option value="alder">Alder</option>
</select>

<div id="games" class="grid"></div>

<!-- Modal = vinduet der popper op når man trykker på det-->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/style.js"></script>
</body>
</html>
