<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>Spiloversigt</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="hero">
  <div class="overlay">
     <button class="menu-btn">&#9776;</button>
    <img src="img/logo.png" alt="Spilcafeen logo" class="logo">
  <nav class="top-menu">
    <ul>
        <li><a href="#">Reserver Bord</a></li>
        <li><a href="#">Membership</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">Spilguide</a></li>
        <li><a href="#" class="active">Spiloversigt</a></li>
        <li><a href="#">In English</a></li>
    </ul>
</nav>
    <h1>SPILOVERSIGT</h1>
  </div>
</header>



<main>

  <!-- FILTER-KONTROLLER -->
  <section class="controls">

    <div class="control-group">
      <label for="search">Søg på titel</label>
      <input
        type="text"
        id="search"
        placeholder="Fx Partners, Hint og UNO"
      />
    </div>

    <div class="control-group">
      <label for="genre">Genre</label>
      <select id="genre">
        <option value="all">Alle genrer</option>
        <option value="Selskabsspil">Selskabsspil</option>
        <option value="Strategi">Strategi</option>
        <option value="Strategi/Logik">Strategi/Logik</option>
        <option value="Strategi/Abstrakt">Strategi/Abstrakt</option>
        <option value="Familie">Familie</option>
        <option value="Festspil">Festspil</option>
        <option value="Abstrakt">Abstrakt</option>
        <option value="Puslespil">Puslespil</option>
        <option value="Aktion">Aktion</option>
        <option value="Kortspil/Familie">Kortspil/Familie</option>
      </select>
    </div>

    <div class="control-group">
      <label for="sort">Sortering</label>
      <select id="sort">
        <option value="none">Ingen sortering</option>
        <option value="title">Titel (A-Å)</option>
        <option value="time">Tid (kortest først)</option>
      </select>
    </div>

  </section>

  <!-- SPILLISTE -->
  <section id="game-list" class="grid"></section>

</main>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <span id="close">&times;</span>
    <div id="modal-body"></div>
  </div>
</div>

<script src="js/style.js"></script>
</body>
</html>
